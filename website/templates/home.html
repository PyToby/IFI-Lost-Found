{% else %}

{% endif %}

<div class="my-6">

    <button class="primary_button mb-8">Přidat nový</button>
    <br>

    <div class="flex">

        <button class="primary_button">Ztraceno</button>
        <button class="primary_button">Nalezeno</button>
        <button class="primary_button">Archiv</button>
