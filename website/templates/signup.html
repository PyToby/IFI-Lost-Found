<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in</title>
  <style>
    :root {
      --bg: #eef2f1;
      --panel: #12403c;
      --panel-text: #e6f2ef;
      --card: #ffffff;
      --text: #14201f;
      --muted: #5b6b69;
      --border: #c9d5d3;
      --accent: #0f766e;
      --accent-hover: #0b5c56;
      --error-bg: #fdecec;
      --error-text: #9b1c1c;
      --font: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0e1615;
        --panel: #0a2623;
        --panel-text: #d7ebe7;
        --card: #16211f;
        --text: #e8f0ee;
        --muted: #98aaa7;
        --border: #2c3d3a;
        --accent: #2dd4bf;
        --accent-hover: #5eead4;
        --error-bg: #3a1a1a;
        --error-text: #fca5a5;
      }
      .btn { color: #06201d; }
    }

    *, *::before, *::after { box-sizing: border-box; }

    html, body { height: 100%; margin: 0; }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      display: grid;
      grid-template-columns: minmax(0, 5fr) minmax(0, 6fr);
      line-height: 1.5;
    }

    /* Left brand panel */
    .brand {
      background: var(--panel);
      color: var(--panel-text);
      padding: 3rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .brand .logo {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: 0.01em;
    }
    .brand p {
      font-size: 1.75rem;
      line-height: 1.25;
      max-width: 16ch;
      margin: 0;
      font-weight: 600;
    }

    /* Right form area */
    main {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .card {
      width: 100%;
      max-width: 22rem;
    }

    h1 {
      font-size: 1.75rem;
      margin: 0 0 0.25rem;
    }
    .sub {
      margin: 0 0 1.75rem;
      color: var(--muted);
    }

    .error {
      display: none; /* remove this line (or set display:block) to show an error */
      background: var(--error-bg);
      color: var(--error-text);
      padding: 0.65rem 0.85rem;
      border-radius: 6px;
      font-size: 0.9rem;
      margin-bottom: 1.25rem;
    }

    label {
      display: block;
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 0.35rem;
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 0.7rem 0.8rem;
      font: inherit;
      color: var(--text);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 6px;
      margin-bottom: 1.1rem;
    }

    input:focus-visible,
    .btn:focus-visible,
    a:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 2px;
    }

    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.9rem;
      margin-bottom: 1.5rem;
    }
    .row label {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-weight: 400;
      margin: 0;
    }
    .row input[type="checkbox"] {
      width: 1rem;
      height: 1rem;
      accent-color: var(--accent);
    }

    a {
      color: var(--accent);
      text-decoration: none;
    }
    a:hover { text-decoration: underline; }

    .btn {
      width: 100%;
      padding: 0.8rem;
      font: inherit;
      font-weight: 600;
      color: #fff;
      background: var(--accent);
      border: 0;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn:hover { background: var(--accent-hover); }

    .foot {
      margin-top: 1.5rem;
      text-align: center;
      font-size: 0.9rem;
      color: var(--muted);
    }

    @media (max-width: 760px) {
      body { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
      .brand { padding: 1.5rem; }
      .brand p { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      .btn { transition: none; }
    }
    /* ---------- Error popup ---------- */
  .popup-toggle {
    position: absolute;
    opacity: 0;
    pointer-events: none;
  }

  .popup-overlay {
    --popup-bg: #ffffff;
    --popup-text: #14201f;
    --popup-muted: #5b6b69;
    --popup-danger: #b42318;
    --popup-danger-hover: #912018;

    position: fixed;
    inset: 0;
    z-index: 1000;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1.5rem;
    background: rgba(10, 20, 19, 0.55);
    animation: popup-fade 0.18s ease-out;
  }

  @media (prefers-color-scheme: dark) {
    .popup-overlay {
      --popup-bg: #16211f;
      --popup-text: #e8f0ee;
      --popup-muted: #98aaa7;
      --popup-danger: #f87171;
      --popup-danger-hover: #fca5a5;
    }
    .popup-btn { color: #2a0a0a; }
  }

  .popup-box {
    width: 100%;
    max-width: 22rem;
    background: var(--popup-bg);
    color: var(--popup-text);
    border-top: 4px solid var(--popup-danger);
    border-radius: 8px;
    padding: 1.5rem;
    font-family: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
    line-height: 1.5;
    box-shadow: 0 12px 32px rgba(0, 0, 0, 0.3);
  }

  .popup-title {
    margin: 0 0 0.35rem;
    font-size: 1.1rem;
    font-weight: 700;
    color: var(--popup-danger);
  }

  .popup-msg {
    margin: 0 0 1.25rem;
    font-size: 0.95rem;
    color: var(--popup-muted);
  }

  .popup-btn {
    display: block;
    width: 100%;
    padding: 0.7rem;
    text-align: center;
    font-size: 1rem;
    font-weight: 600;
    color: #fff;
    background: var(--popup-danger);
    border-radius: 6px;
    cursor: pointer;
  }
  .popup-btn:hover { background: var(--popup-danger-hover); }

  /* Keyboard focus: Tab to it, press Space to close */
  .popup-toggle:focus-visible ~ .popup-overlay .popup-btn {
    outline: 3px solid var(--popup-danger);
    outline-offset: 2px;
  }

  /* Close */
  .popup-toggle:checked ~ .popup-overlay { display: none; }

  @keyframes popup-fade {
    from { opacity: 0; }
    to   { opacity: 1; }
  }
  @media (prefers-reduced-motion: reduce) {
    .popup-overlay { animation: none; }
  }
  </style>
</head>
<body>

  <aside class="brand">
    <div class="logo">YourApp</div>
    <p>Pick up where you left off.</p>
  </aside>
  {% if error %}
<input type="checkbox" id="popup-close" class="popup-toggle" aria-label="Close error message">
<div class="popup-overlay" role="alertdialog" aria-labelledby="popup-title" aria-describedby="popup-msg">
  <div class="popup-box">
    <h2 class="popup-title" id="popup-title">Something went wrong</h2>
    <p class="popup-msg" id="popup-msg">{{ error }}</p>
    <label for="popup-close" class="popup-btn">Close</label>
  </div>
</div>
{% endif %}
  <main>
    <div class="card">
      <h1>Sign in</h1>
      <p class="sub">Enter your details to access your account.</p>

      <!-- Show on failed login. With Flask/Jinja: {{ error }} -->
      <div class="error" role="alert">Incorrect username or password.</div>

      <form method="POST" action="/auth/signup">
        <label for="username">Email</label>
        <input type="text" id="username" name="email" autocomplete="email" required autofocus>

        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="new-password" required>

        <label for="password">Enter password again</label>
        <input type="password" id="password" name="password2" autocomplete="new-password" required>

        <!--<div class="row">
          <label><input type="checkbox" name="remember"> Remember me</label>
          <a href="/forgot-password">Forgot password?</a>
        </div>-->

        <button type="submit" class="btn">Sign up</button>
      </form> 

      <p class="foot">Already have an account? <a href="/auth/login">Log in</a></p>
    </div>
  </main>

</body>
</html>
