<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#ffffff">
<title>IFILAF — Lost &amp; Found</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%230a0a0a'/><path d='M11 8h4.5v12.5H23V25H11z' fill='%23fff'/></svg>">

<style>
/* ============================================================
   1. TOKENS
   ============================================================ */
:root{
  --ink:#0a0a0a;            /* near-black: text, fills, Lost tag */
  --paper:#ffffff;
  --g50:#fafafa;
  --g100:#f4f4f5;           /* placeholder / readonly surface */
  --g200:#e4e4e7;           /* default 1px border */
  --g300:#d4d4d8;
  --g400:#a1a1aa;           /* decorative icons */
  --g500:#71717a;           /* secondary text (4.9:1 on white) */
  --text-2:var(--g500);
  --radius:6px;             /* one radius, everywhere */
  --nav-h:56px;
  --ease-out:cubic-bezier(.23,1,.32,1);   /* strong ease-out for UI */
  --font:'Inter',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
}
*,*::before,*::after{ box-sizing:border-box }
[hidden]{ display:none !important }
html{ -webkit-text-size-adjust:100%; color-scheme:light; scrollbar-gutter:stable }
body{
  margin:0; background:var(--paper); color:var(--ink);
  font:400 15px/1.5 var(--font);
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  caret-color:var(--ink);
}
::selection{ background:var(--ink); color:#fff }
h1,h2,h3,p,figure,fieldset{ margin:0 }
fieldset{ border:0; padding:0; min-width:0 }
img{ max-width:100%; display:block }
a{ color:inherit }
button{ font:inherit; color:inherit }

/* thin neutral scrollbar belongs to the design too */
*{ scrollbar-width:thin; scrollbar-color:var(--g300) transparent }
::-webkit-scrollbar{ width:10px; height:10px }
::-webkit-scrollbar-track{ background:transparent }
::-webkit-scrollbar-thumb{ background:var(--g300); border-radius:99px; border:2px solid var(--paper) }
::-webkit-scrollbar-thumb:hover{ background:var(--g400) }

/* one focus treatment for the whole app */
:where(a,button,input,select,textarea,summary,[tabindex]):focus-visible{
  outline:2px solid var(--ink); outline-offset:2px;
}

.sr-only{
  position:absolute; width:1px; height:1px; padding:0; margin:-1px;
  overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0;
}
.skip{
  position:fixed; top:-64px; left:12px; z-index:60;
  background:var(--paper); border:1px solid var(--ink); border-radius:var(--radius);
  padding:9px 14px; font-size:14px; font-weight:600; text-decoration:none;
  transition:top 150ms var(--ease-out);
}
.skip:focus{ top:12px }

/* ============================================================
   2. NAVBAR
   ============================================================ */
.nav{
  position:sticky; top:0; z-index:40;
  background:var(--paper); border-bottom:1px solid var(--g200);
}
.nav__inner{
  max-width:1120px; margin:0 auto; padding:0 16px;
  height:var(--nav-h); display:flex; align-items:center; justify-content:space-between; gap:12px;
}
.wordmark{
  font-size:14px; font-weight:800; letter-spacing:.14em; text-transform:uppercase;
  text-decoration:none; color:var(--ink);
}
.nav__right{ display:flex; align-items:center; gap:10px }
.nav__user{ position:relative }
.avatar{
  width:32px; height:32px; border-radius:50%; border:0; padding:0;
  background:var(--ink); color:#fff; font-size:13px; font-weight:700;
  display:grid; place-items:center; cursor:pointer;
  transition:transform 150ms var(--ease-out);
}
.avatar:active{ transform:scale(.94) }
.menu{
  position:absolute; right:0; top:calc(100% + 10px); min-width:236px; z-index:50;
  background:var(--paper); border:1px solid var(--g200); border-radius:var(--radius);
  padding:6px; transform-origin:top right;
  animation:menu-in 150ms var(--ease-out) backwards;
}
.menu__email{
  font-size:12.5px; color:var(--text-2); padding:8px 10px 9px;
  border-bottom:1px solid var(--g200); margin-bottom:5px;
  overflow-wrap:anywhere; font-variant-numeric:tabular-nums;
}
.menu__item{
  display:block; width:100%; text-align:left; background:none; border:0;
  border-radius:4px; padding:9px 10px; font-size:14px; font-weight:500; cursor:pointer;
  transition:background-color 140ms var(--ease-out);
}
@media (hover:hover) and (pointer:fine){ .menu__item:hover{ background:var(--g100) } }
.menu__item:active{ background:var(--g100) }

/* ============================================================
   3. BUTTONS
   ============================================================ */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:7px;
  height:36px; padding:0 14px; border-radius:var(--radius);
  border:1px solid var(--ink); background:var(--paper); color:var(--ink);
  font-size:14px; font-weight:600; text-decoration:none; white-space:nowrap; cursor:pointer;
  transition:transform 150ms var(--ease-out), background-color 150ms var(--ease-out),
             border-color 150ms var(--ease-out), color 150ms var(--ease-out);
}
.btn:active{ transform:scale(.97) }
.btn--primary{ background:var(--ink); color:#fff }
.btn--ghost{ border-color:var(--g200); font-weight:500 }
.btn--lg{ height:46px; padding:0 22px; font-size:15px }
.btn--block{ width:100% }
@media (hover:hover) and (pointer:fine){
  .btn:hover{ border-color:var(--ink); background:var(--g50) }
  .btn--primary:hover{ background:#262626; border-color:#262626 }
  .btn--ghost:hover{ border-color:var(--g400) }
}

/* ============================================================
   4. FORM
   ============================================================ */
main{ max-width:1120px; margin:0 auto; padding:20px 16px 72px }
.page-title{
  font-size:clamp(23px,5.5vw,28px); font-weight:600; letter-spacing:-.02em; line-height:1.15;
  margin:4px 0 22px;
}
.form{ max-width:560px }
.field, .fieldset{ display:flex; flex-direction:column; gap:7px; margin-bottom:18px }
.label{ font-size:13.5px; font-weight:600; letter-spacing:.005em }
.label .opt{ font-weight:400; color:var(--text-2) }
.hint{ font-size:12.5px; color:var(--text-2) }
.err{
  font-size:13px; font-weight:500; color:var(--ink);
  display:flex; align-items:center; gap:7px;
}
.err::before{
  content:"!"; flex:none; width:15px; height:15px; border:1px solid var(--ink); border-radius:50%;
  display:grid; place-items:center; font-size:10px; font-weight:800; line-height:1;
}
.input, select, textarea{
  width:100%; font:400 15px/1.4 var(--font); color:var(--ink);
  background:var(--paper); border:1px solid var(--g200); border-radius:var(--radius);
  transition:border-color 150ms var(--ease-out), background-color 150ms var(--ease-out);
}
.input, select{ height:42px; padding:0 12px }
textarea{ min-height:96px; padding:11px 12px; line-height:1.55; resize:vertical }
.input::placeholder, textarea::placeholder{ color:var(--text-2) }
.input:hover, select:hover, textarea:hover{ border-color:var(--g400) }
.input:focus, select:focus, textarea:focus{ border-color:var(--ink); outline:none }
.input:focus-visible, select:focus-visible, textarea:focus-visible{ outline:2px solid var(--ink); outline-offset:1px }
.input[readonly]{ background:var(--g100); border-color:var(--g200); cursor:default }
select{
  appearance:none; padding-right:36px; cursor:pointer;
  background-image:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%2371717a' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='m6 9 6 6 6-6'/></svg>");
  background-repeat:no-repeat; background-position:right 12px center;
}
.field.is-error .input, .field.is-error textarea, .field.is-error select{ border-color:var(--ink) }

/* segmented control (Type) */
.seg{
  position:relative; display:grid; grid-auto-flow:column; grid-auto-columns:1fr;
  gap:0; padding:3px; border:1px solid var(--g200); border-radius:var(--radius);
  background:var(--paper); isolation:isolate;
}
.seg input{ position:absolute; opacity:0; width:1px; height:1px; margin:0 }
.seg label{ position:relative; z-index:1; cursor:pointer }
.seg label span{
  display:flex; align-items:center; justify-content:center; height:34px;
  border-radius:4px; font-size:14px; font-weight:600; color:var(--text-2);
  transition:color 160ms var(--ease-out);
}
.seg input:checked + label span{ color:#fff }
.seg input:focus-visible + label span{ outline:2px solid var(--ink); outline-offset:2px }
.seg__ind{
  position:absolute; z-index:0; top:3px; bottom:3px; left:3px;
  width:calc(50% - 3px); background:var(--ink); border-radius:4px;
  transition:transform 200ms var(--ease-out);
}
#type-found:checked ~ .seg__ind{ transform:translateX(100%) }

/* photo upload */
.photo{ display:flex; align-items:center; gap:12px; flex-wrap:wrap }
#in-photo:focus-visible + .btn{ outline:2px solid var(--ink); outline-offset:2px }
.photo__prev{ position:relative; width:72px; height:72px }
.photo__prev img{
  width:72px; height:72px; object-fit:cover;
  border:1px solid var(--g200); border-radius:var(--radius);
}
.photo__x{
  position:absolute; top:-7px; right:-7px; width:22px; height:22px; padding:0;
  background:var(--paper); border:1px solid var(--ink); border-radius:50%;
  display:grid; place-items:center; cursor:pointer;
  transition:transform 150ms var(--ease-out), background-color 150ms var(--ease-out), color 150ms var(--ease-out);
}
.photo__x:hover{ background:var(--ink); color:#fff }
.photo__x:active{ transform:scale(.9) }

.form__actions{ display:flex; align-items:center; gap:10px; margin-top:26px }

/* success state */
.success{
  min-height:52vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:16px; text-align:center;
  animation:rise 260ms var(--ease-out) backwards;
}
.success:focus{ outline:none }
.success__icon{
  width:48px; height:48px; border:1px solid var(--ink); border-radius:50%;
  display:grid; place-items:center;
}
.success__icon path{ stroke-dasharray:26; stroke-dashoffset:26; animation:draw 420ms var(--ease-out) 140ms forwards }
.success__line{ font-size:16px; font-weight:600 }
.success__actions{ display:flex; gap:10px; flex-wrap:wrap; justify-content:center }

/* ============================================================
   5. FILTER ROW
   ============================================================ */
.filters{
  display:flex; flex-wrap:wrap; align-items:center; gap:8px 10px;
  padding:6px 0 18px;
}
.tabs{ display:flex; align-items:center; gap:2px }
.tab{
  background:none; border:0; border-bottom:1.5px solid transparent;
  padding:7px 10px 8px; font-size:14px; font-weight:500; color:var(--text-2);
  cursor:pointer; border-radius:0;
  transition:color 150ms var(--ease-out), border-color 150ms var(--ease-out);
}
.tab[aria-pressed="true"]{ color:var(--ink); font-weight:650; border-bottom-color:var(--ink) }
.tab:active{ transform:scale(.97) }
.filters__div{ width:1px; height:20px; background:var(--g200) }
.chips{ display:flex; gap:8px }
.chip{
  height:33px; padding:0 13px; border-radius:var(--radius);
  border:1px solid var(--g200); background:var(--paper); color:var(--ink);
  font-size:13.5px; font-weight:600; cursor:pointer;
  transition:transform 150ms var(--ease-out), background-color 150ms var(--ease-out),
             color 150ms var(--ease-out), border-color 150ms var(--ease-out);
}
.chip[aria-pressed="true"]{ background:var(--ink); border-color:var(--ink); color:#fff }
.chip:active{ transform:scale(.97) }
@media (hover:hover) and (pointer:fine){ .chip:hover{ border-color:var(--ink) } }

.search{ position:relative; display:flex; align-items:center; flex:1 1 100%; order:3 }
.search__ico{ position:absolute; left:11px; color:var(--g500); pointer-events:none; display:flex }
.search input{
  width:100%; height:38px; padding:0 34px 0 34px;
  font:400 14.5px var(--font); color:var(--ink);
  background:var(--paper); border:1px solid var(--g200); border-radius:var(--radius);
  transition:border-color 150ms var(--ease-out);
  -webkit-appearance:none; appearance:none;
}
.search input::-webkit-search-cancel-button{ display:none }
.search input::placeholder{ color:var(--text-2) }
.search input:hover{ border-color:var(--g400) }
.search input:focus{ border-color:var(--ink); outline:none }
.search input:focus-visible{ outline:2px solid var(--ink); outline-offset:1px }
.search__x{
  position:absolute; right:6px; width:26px; height:26px; padding:0;
  background:none; border:0; border-radius:4px; color:var(--g500);
  display:grid; place-items:center; cursor:pointer;
  transition:color 140ms var(--ease-out), background-color 140ms var(--ease-out);
}
.search__x:hover{ color:var(--ink); background:var(--g100) }

/* ============================================================
   6. ITEM GRID + CARDS
   ============================================================ */
.grid{ display:grid; grid-template-columns:1fr; gap:12px }
.card{
  display:flex; gap:14px; min-width:0; text-decoration:none;
  background:var(--paper); border:1px solid var(--g200); border-radius:var(--radius);
  padding:12px; overflow:hidden;
  transition:transform 170ms var(--ease-out), border-color 170ms var(--ease-out);
}
.card__media{
  flex:0 0 86px; width:86px; height:86px; border-radius:4px; overflow:hidden;
  background:var(--g100); border:1px solid var(--g200);
  display:grid; place-items:center; color:var(--g400);
}
.card__media img{ width:100%; height:100%; object-fit:cover }
.card__body{ flex:1; min-width:0; display:flex; flex-direction:column; gap:7px; justify-content:center }
.card__top{ display:flex; align-items:flex-start; gap:8px; flex-wrap:wrap }
.card__name{
  flex:1; min-width:0; font-size:15px; font-weight:600; letter-spacing:-.01em; line-height:1.3;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
}
.card__tags{ display:flex; gap:6px; margin-left:auto }
.card__meta{
  display:flex; align-items:center; gap:6px; min-width:0;
  font-size:13px; color:var(--text-2); font-variant-numeric:tabular-nums;
}
.card__loc{ display:flex; align-items:center; gap:5px; min-width:0; overflow:hidden }
.card__loc span{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
.card__meta time{ flex:none }
.card__dot{ flex:none; color:var(--g400) }

@media (hover:hover) and (pointer:fine){
  .card:hover{ border-color:var(--ink); transform:translateY(-2px) }
}

.tag{
  display:inline-flex; align-items:center; height:21px; padding:0 8px;
  border:1px solid var(--ink); border-radius:var(--radius);
  font-size:10.5px; font-weight:700; letter-spacing:.07em; text-transform:uppercase; white-space:nowrap;
}
.tag--lost{ background:var(--ink); color:#fff }
.tag--found{ background:var(--paper); color:var(--ink) }
.tag--open{ background:var(--paper); color:var(--ink) }
.tag--resolved{ background:var(--paper); border-color:var(--g300); color:var(--text-2) }

.empty{
  padding:72px 0; text-align:center; font-size:14.5px; color:var(--text-2);
}

/* ============================================================
   7. ITEM DETAIL
   ============================================================ */
.back{
  display:inline-flex; align-items:center; gap:7px;
  font-size:14px; font-weight:500; color:var(--text-2); text-decoration:none;
  margin-bottom:20px;
  transition:color 150ms var(--ease-out), transform 150ms var(--ease-out);
}
.back:hover{ color:var(--ink) }
.back:active{ transform:scale(.97) }
.detail{ display:grid; gap:26px }
.dmedia{
  aspect-ratio:4/3; background:var(--g100); border:1px solid var(--g200);
  border-radius:var(--radius); display:grid; place-items:center; color:var(--g400); overflow:hidden;
}
.dmedia img{ width:100%; height:100%; object-fit:contain }
.d-title{
  font-size:clamp(24px,6vw,32px); font-weight:600; letter-spacing:-.025em; line-height:1.12;
  text-wrap:balance;
}
.d-tags{ display:flex; gap:8px; margin-top:14px; flex-wrap:wrap }
.d-desc{ margin-top:16px; font-size:15px; line-height:1.6; max-width:65ch; color:#27272a }
.dl{ margin-top:22px; border-top:1px solid var(--g200) }
.dl .row{
  display:flex; justify-content:space-between; align-items:baseline; gap:20px;
  padding:11.5px 0; border-bottom:1px solid var(--g200); font-size:14px;
}
.dl dt{ color:var(--text-2); flex:none }
.dl dd{ margin:0; text-align:right; font-weight:500; overflow-wrap:anywhere; font-variant-numeric:tabular-nums }
.link{ color:var(--ink); text-underline-offset:3px; text-decoration-thickness:1px; font-weight:500 }
@media (hover:hover) and (pointer:fine){ .link:hover{ text-decoration-thickness:2px } }
.actions{ display:flex; gap:10px; flex-wrap:wrap; margin-top:24px }

/* ============================================================
   8. LOGIN
   ============================================================ */
.center{
  min-height:calc(100svh - var(--nav-h) - 140px);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px;
}
.login-err{
  font-size:13.5px; font-weight:500; color:var(--ink); text-align:center;
  animation:rise 180ms var(--ease-out) backwards;
}

/* ============================================================
   9. MOTION
   ============================================================ */
@keyframes rise{ from{ opacity:0; transform:translateY(6px) } to{ opacity:1; transform:none } }
@keyframes draw{ to{ stroke-dashoffset:0 } }
@keyframes menu-in{ from{ opacity:0; transform:scale(.97) } to{ opacity:1; transform:none } }

/* route enter — purpose: orient the swap, once per navigation */
main.is-enter{ animation:rise 240ms var(--ease-out) backwards }
/* first grid mount only — removed after it plays so hover keeps working */
.grid--stagger > .card{
  animation:rise 300ms var(--ease-out) backwards;
  animation-delay:calc(var(--i,0) * 45ms);
}
/* a field appearing because Type switched to Found */
.field--enter{ animation:rise 170ms var(--ease-out) backwards }

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.01ms !important; animation-delay:0ms !important;
    transition-duration:.01ms !important; transition-delay:0ms !important;
  }
  .btn:active,.chip:active,.tab:active,.avatar:active,.card:hover{ transform:none !important }
}

/* ============================================================
   10. RESPONSIVE
   ============================================================ */
@media (min-width:600px){
  main{ padding:26px 24px 88px }
  .nav__inner{ padding:0 24px }
  .grid{ grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:16px }
  .card{ flex-direction:column; gap:0; padding:0 }
  .card__media{ width:100%; height:auto; aspect-ratio:3/2; flex:none; border:0; border-bottom:1px solid var(--g200); border-radius:0 }
  .card__media svg{ width:36px; height:36px }
  .card__body{ padding:14px 15px 16px; gap:8px; justify-content:flex-start }
  .search{ flex:0 0 236px; order:0; margin-left:auto }
}
@media (min-width:880px){
  main{ padding:32px 32px 96px }
  .nav__inner{ padding:0 32px }
  .detail{ grid-template-columns:1.05fr 1fr; gap:44px; align-items:start }
  .d-media-col{ position:sticky; top:calc(var(--nav-h) + 24px) }
}
</style>
</head>

<body>
<!--
DIRECTION CONTRACT
THESIS: The board is the page — no hero, no taglines; the item grid is the entire home screen, and the only color on any page is a student's uploaded photo.
OWN-WORLD: White paper, near-black ink, 1px zinc hairlines, a single 6px radius, one sans; tags carry state — filled black = Lost, outline = Found, grey = Resolved.
STORY: A student lands, scans, filters, opens an item and emails its poster with no account; login only gates posting, and only school-domain accounts may post.
FIRST VIEWPORT: sticky hairline navbar (IFILAF · Login), filter row (All/Mine · Lost/Found · search), then the grid — horizontal cards under 600px, photo columns above; Add item becomes the primary action once signed in.
FORM: Operate; direction pinned by the black-and-white brief, so the concept roll was not run.
FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, DESIGN.md, and every shipping raster carrying its provenance.
-->

<header class="nav">
  <div class="nav__inner" id="nav"></div>
</header>

<main id="main" tabindex="-1"></main>

<script>
/* ============================================================
   IFILAF — Lost & Found
   Single-file frontend. No backend, no build step.
   Data lives in memory; a refresh resets to the sample data.

   >>> Everything you'll want to change is in CONFIG below. <<<
   ============================================================ */

/* ------------------------------------------------------------
   CONFIG
   ------------------------------------------------------------ */

// 1. School domain — Google sign-in is restricted to this domain.
const SCHOOL_DOMAIN = 'jkg.cz';

// 2. Wordmark in the navbar.
const WORDMARK = 'IFILAF';

// 3. Flip to true to simulate signing in with a NON-school account
//    and test the domain-restriction error on the login page.
const SIMULATE_NON_SCHOOL_ACCOUNT = false;

// 4. The fake accounts used by the simulated Google login.
const SCHOOL_ACCOUNT  = { name: 'Jan Novák', email: 'jan.novak@' + SCHOOL_DOMAIN };
const OUTSIDE_ACCOUNT = { name: 'Demo User', email: 'demo.user@gmail.com' };

// 5. Categories offered in the Add-item form.
const CATEGORIES = ['Clothing', 'Electronics', 'Keys', 'Bottles', 'Books', 'Bags', 'Other'];

// Helper: an ISO date N days ago, so samples always look recent.
function daysAgo(days, hour = 9, minute = 0) {
  const d = new Date();
  d.setDate(d.getDate() - days);
  d.setHours(hour, minute, 0, 0);
  return d.toISOString();
}

// 6. Sample data (synthetic). Replace freely — `photo` is a data URL
//    or '' for the neutral placeholder, `owner` decides who may
//    edit/resolve/delete (items owned by SCHOOL_ACCOUNT are "Mine").
const SEED_ITEMS = [
  { id:'i1', type:'lost', name:'Keys with a red fabric tag', category:'Keys',
    description:'Three keys on a carabiner: two door keys and one bike-lock key, with a red fabric tag.',
    location:'Main hallway, 2nd floor', date:daysAgo(2,8,15), color:'Silver, red tag',
    currentLocation:'', photo:'', owner:'jan.novak@jkg.cz', status:'open' },

  { id:'i2', type:'found', name:'Black folding umbrella', category:'Other',

/* ------------------------------------------------------------

   ------------------------------------------------------------ */
const esc = s => String(s ?? '').replace(/[&<>"']/g,
  c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

const pad = n => String(n).padStart(2, '0');

function fmtShort(iso) {
  const d = new Date(iso), now = new Date();
  const opts = { day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' };
  if (d.getFullYear() !== now.getFullYear()) opts.year = 'numeric';
  return d.toLocaleString(undefined, opts);
}
const fmtFull = iso => new Date(iso).toLocaleString(undefined,
  { dateStyle:'medium', timeStyle:'short' });

function toInputValue(iso) {
  const d = new Date(iso);
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

/* ------------------------------------------------------------
   ROUTER
   ------------------------------------------------------------ */
function currentRoute() {
  const hash = location.hash || '#/';
  const parts = hash.slice(1).split('/').filter(Boolean);   // ['item','i3']
  return { name: parts[0] || 'home', param: parts[1] || null, path: '#' + parts.join('/') };
}

const TITLES = {
  home: () => `${WORDMARK} — Lost & Found`,
  login: () => `Sign in — ${WORDMARK}`,
  add:   () => `Add item — ${WORDMARK}`,
  item:  id => {
    const it = state.items.find(i => i.id === id);
    return (it ? it.name : 'Item') + ` — ${WORDMARK}`;
  },
};

let lastPath = null;
const scrollMemo = {};   // where each route was left, so Back feels continuous

function render() {
  const r = currentRoute();

  // Route guard: adding requires a signed-in school account.
  if (r.name === 'add' && !state.user) {
    state.returnTo = `#/add${r.param ? '/' + r.param : ''}`;
    location.hash = '#/login';
    return;
  }

  const prevPath = lastPath;
  const pathChanged = prevPath !== r.path;

  // Per-navigation state resets.
  if (pathChanged) {
    if (prevPath !== null) scrollMemo[prevPath] = window.scrollY;
    state.justAdded = null;
    state.confirmDelete = null;
    state.loginError = '';
    lastPath = r.path;
  }

  const view = document.getElementById('main');
  let html;
  if (r.name === 'login')      html = loginView();
  else if (r.name === 'add')   html = addView(r.param);
  else if (r.name === 'item')  html = itemView(r.param);
  else                         html = homeView();

  view.innerHTML = html;
  view.classList.remove('is-enter');
  void view.offsetWidth;                 // restart the route animation
  view.classList.add('is-enter');

  document.title = (TITLES[r.name] || TITLES.home)(r.param);
  renderNav();

  // On a real navigation (not the initial load): restore where the
  // user left this route, and move focus to the new view.
  if (prevPath !== null && pathChanged) {
    window.scrollTo(0, scrollMemo[r.path] || 0);
    view.focus({ preventScroll: true });
  }

  // Post-render focus management.
  if (r.name === 'login' && state.loginError) document.getElementById('loginBtn')?.focus();
  if (r.name === 'add' && state.justAdded) view.querySelector('.success')?.focus();
  disarmStagger(view);
}

// Staggered first paint must stop owning transform once it has played,
// or the cards' hover lift would stay overridden by the animation fill.
function disarmStagger(root) {
  const g = root.querySelector('.grid--stagger');
  if (g) setTimeout(() => g.classList.remove('grid--stagger'), 1300);
}

/* ------------------------------------------------------------
   NAVBAR
   ------------------------------------------------------------ */
function renderNav() {
  const right = state.user
    ? `<a class="btn btn--primary" href="#/add">${icon('plus', 15)}Add item</a>
       <div class="nav__user">
         <button class="avatar" data-action="toggle-menu" aria-haspopup="true"
                 aria-expanded="${state.menuOpen}" aria-label="Account menu">
           ${esc(state.user.name.charAt(0).toUpperCase())}
         </button>
         <div class="menu" id="navMenu" role="menu" ${state.menuOpen ? '' : 'hidden'}>
           <p class="menu__email">${esc(state.user.email)}</p>
           <button class="menu__item" role="menuitem" data-action="logout">Sign out</button>
         </div>
       </div>`
    : `<a class="btn" href="#/login" data-action="go-login">Login</a>`;

  document.getElementById('nav').innerHTML =
    `<a class="wordmark" href="#/">${esc(WORDMARK)}</a><div class="nav__right">${right}</div>`;
}

/* ------------------------------------------------------------
   HOME
   ------------------------------------------------------------ */
function visibleItems() {
  const f = state.filters;
  const q = f.q.trim().toLowerCase();
  return state.items
    .filter(i => !f.mine || (state.user && i.owner === state.user.email))
    .filter(i => !f.type || i.type === f.type)
    .filter(i => !q || [i.name, i.location, i.category, i.description, i.color]
      .join(' ').toLowerCase().includes(q))
    .sort((a, b) => new Date(b.date) - new Date(a.date));
}

function mediaHTML(item) {
  if (item.photo) return `<img src="${item.photo}" alt="${esc(item.name)}" loading="lazy">`;
  return icon(item.category || 'Other', 30);
}

function cardHTML(item, i) {
  // Grid cards carry the type tag only; status lives on the detail page.
  const tags = `<span class="tag tag--${item.type}">${item.type === 'lost' ? 'Lost' : 'Found'}</span>`;
  const stagger = state.seenGrid ? '' : ' style="--i:' + Math.min(i, 9) + '"';
  return `
    <a class="card"${stagger} href="#/item/${esc(item.id)}">
      <div class="card__media">${mediaHTML(item)}</div>
      <div class="card__body">
        <div class="card__top">
          <h3 class="card__name">${esc(item.name)}</h3>
          <span class="card__tags">${tags}</span>
        </div>
        <p class="card__meta">
          <span class="card__loc">${icon('pin', 13)}<span>${esc(item.location)}</span></span>
          <span class="card__dot" aria-hidden="true">·</span>
          <time datetime="${esc(item.date)}">${fmtShort(item.date)}</time>
        </p>
      </div>
    </a>`;
}

function gridHTML() {
  const list = visibleItems();
  if (!list.length) {
    return `<p class="empty">${state.filters.q.trim() ? 'No items match your search.' : 'No items here.'}</p>`;
  }
  const stagger = !state.seenGrid;
  const html = `<div class="grid${stagger ? ' grid--stagger' : ''}">${list.map(cardHTML).join('')}</div>`;
  if (stagger) state.seenGrid = true;
  return html;
}

function renderGrid() {
  const w = document.getElementById('gridwrap');
  if (w) { w.innerHTML = gridHTML(); disarmStagger(w); }
}

function homeView() {
  const f = state.filters;
  return `
    <h1 class="sr-only">Lost and found items</h1>
    <div class="filters" role="group" aria-label="Filter items">
      <div class="tabs">
        <button class="tab" data-tab="all"  aria-pressed="${!f.mine}">All</button>
        ${state.user ? `<button class="tab" data-tab="mine" aria-pressed="${f.mine}">Mine</button>` : ''}
      </div>
      <span class="filters__div" aria-hidden="true"></span>
      <div class="chips">

        <button class="search__x" data-action="clear-search" aria-label="Clear search"

function loginView() {

      </button>

    </div>`;
}

function doLogin() {
  const acct = SIMULATE_NON_SCHOOL_ACCOUNT ? OUTSIDE_ACCOUNT : SCHOOL_ACCOUNT;
  const allowed = acct.email.toLowerCase().endsWith('@' + SCHOOL_DOMAIN.toLowerCase());
  if (!allowed) {
    state.loginError = `Use your ${SCHOOL_DOMAIN} school account to sign in.`;
    render();
    return;
  }
  state.user = acct;
  state.loginError = '';
  let back = state.returnTo || '#/';
  if (!back.startsWith('#') || back === '#/login') back = '#/';
  state.returnTo = '#/';
  if ((location.hash || '#/') === back) render();
  else location.hash = back;
}

function logout() {
  state.user = null;
  state.filters.mine = false;
  state.menuOpen = false;
  if ((location.hash || '#/') === '#/') render();
  else location.hash = '#/';
}

   ADD / EDIT
   ------------------------------------------------------------ */
function field(opts) {
  const { id, label, optional, control, hint } = opts;
  return `
    <div class="field" id="f-${id}">
      <label class="label" for="in-${id}">${label}${optional ? ' <span class="opt">optional</span>' : ''}</label>

      <p class="err" id="e-${id}" hidden aria-live="polite"></p>
    </div>`;
}

function addView(id) {
  if (state.justAdded) return successView();

  const item = id ? state.items.find(i => i.id === id) : null;
  if (id && !item) {

            <p class="empty">This item no longer exists.</p>`;

function successView() {
  const { id, mode } = state.justAdded;
  return `
    <div class="success" role="status" tabindex="-1">

             stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="m5 12.5 4.6 4.6L19 7"/>
        </svg>
      </span>
      <p class="success__line">${mode === 'edit' ? 'Changes saved.' : 'Your item is posted.'}</p>
      <div class="success__actions">
        <a class="btn btn--primary" href="#/item/${esc(id)}">View item</a>
        <a class="btn btn--ghost" href="#/">Back to items</a>
      </div>
    </div>`;
}

function setError(fieldId, msg) {
  const field = document.getElementById('f-' + fieldId);
  if (!field) return;
  field.classList.toggle('is-error', !!msg);
  const err = field.querySelector('.err');
  err.textContent = msg || '';
  err.hidden = !msg;
  const input = field.querySelector('input, textarea, select');
  if (input) input.setAttribute('aria-invalid', msg ? 'true' : 'false');
}

function submitForm(form) {
  const name = form.querySelector('#in-name').value.trim();
  const location_ = form.querySelector('#in-location').value.trim();

  let firstBad = null;
  if (!name)          { setError('name', 'Give the item a name.'); firstBad = firstBad || '#in-name'; }
  else                { setError('name', ''); }
  if (!location_)     { setError('location', 'Add where it was lost or found.'); firstBad = firstBad || '#in-location'; }
  else                { setError('location', ''); }
  if (firstBad) { form.querySelector(firstBad).focus(); return; }

  const type = form.querySelector('[name=type]:checked').value;
  const prev = document.getElementById('photoPrev');
  const photo = (prev && !prev.hidden) ? document.getElementById('photoImg').src : '';
  const dateRaw = form.querySelector('#in-date').value;
  const editId = form.dataset.edit;
  const existing = editId ? state.items.find(i => i.id === editId) : null;

  const record = {
    id: existing ? existing.id : 'i' + Date.now(),
    type,
    name,
    category: form.querySelector('#in-category').value,
    description: form.querySelector('#in-description').value.trim(),
    location: location_,
    date: dateRaw ? new Date(dateRaw).toISOString() : new Date().toISOString(),
    color: form.querySelector('#in-color').value.trim(),
    currentLocation: type === 'found' ? form.querySelector('#in-current').value.trim() : '',
    photo,
    owner: existing ? existing.owner : state.user.email,
    status: existing ? existing.status : 'open',
  };

  if (existing) Object.assign(existing, record);
  else state.items.push(record);

  state.justAdded = { id: record.id, mode: existing ? 'edit' : 'add' };
  render();
}

function itemView(id) {
  const item = state.items.find(i => i.id === id);
  const back = `<a class="back" href="#/">${icon('back', 14)}Items</a>`;
  if (!item) return back + `<p class="empty">This item no longer exists.</p>`;

  const owner = state.user && state.user.email === item.owner;
  const media = item.photo
    ? `<img src="${item.photo}" alt="${esc(item.name)}">`
    : icon(item.category || 'Other', 56);

  const rows = [
    item.category ? ['Category', esc(item.category)] : null,
    ['Location', esc(item.location)],
    [item.type === 'found' ? 'Found' : 'Lost', esc(fmtFull(item.date))],
    item.color ? ['Color', esc(item.color)] : null,
    item.type === 'found' && item.currentLocation ? ['Where it is now', esc(item.currentLocation)] : null,
    ['Contact', `<a class="link" href="mailto:${esc(item.owner)}?subject=${encodeURIComponent((item.type === 'lost' ? 'Lost item: ' : 'Found item: ') + item.name)}">${esc(item.owner)}</a>`],
  ].filter(Boolean);

  return `
    ${back}
    <div class="detail">
      <div class="d-media-col">
        <div class="dmedia">${media}</div>
      </div>
      <div class="d-info">
        <h1 class="d-title">${esc(item.name)}</h1>
        <div class="d-tags">
          <span class="tag tag--${item.type}">${item.type === 'lost' ? 'Lost' : 'Found'}</span>
          <span class="tag tag--${item.status === 'resolved' ? 'resolved' : 'open'}">${item.status === 'resolved' ? 'Resolved' : 'Open'}</span>
        </div>
        ${item.description ? `<p class="d-desc">${esc(item.description)}</p>` : ''}
        <dl class="dl">
          ${rows.map(([k, v]) => `<div class="row"><dt>${k}</dt><dd>${v}</dd></div>`).join('')}
        </dl>
        ${owner ? `
        <div class="actions">
          <a class="btn btn--ghost" href="#/add/${esc(item.id)}">Edit</a>
          ${item.status === 'open'
            ? `<button class="btn btn--primary" data-action="mark-resolved" data-id="${esc(item.id)}">${icon('check', 15)}Mark as resolved</button>`
            : ''}
          <button class="btn ${state.confirmDelete === item.id ? 'btn--primary' : 'btn--ghost'}"
                  data-action="delete" data-id="${esc(item.id)}">
            ${state.confirmDelete === item.id ? 'Confirm delete?' : 'Delete'}
          </button>
        </div>` : ''}
      </div>
    </div>`;
}

/* ------------------------------------------------------------
   INTERACTIONS
   ------------------------------------------------------------ */
function syncFilters() {
  document.querySelectorAll('[data-tab]').forEach(b =>
    b.setAttribute('aria-pressed', String((b.dataset.tab === 'mine') === state.filters.mine)));
  document.querySelectorAll('[data-type]').forEach(b =>
    b.setAttribute('aria-pressed', String(b.dataset.type === state.filters.type)));
  const clear = document.querySelector('[data-action="clear-search"]');
  if (clear) clear.hidden = !state.filters.q;
  renderGrid();
}

function closeMenu() {
  if (!state.menuOpen) return;
  state.menuOpen = false;
  const menu = document.getElementById('navMenu');
  const btn = document.querySelector('[data-action="toggle-menu"]');
  if (menu) menu.hidden = true;
  if (btn) btn.setAttribute('aria-expanded', 'false');
}

function toggleMenu() {
  state.menuOpen = !state.menuOpen;
  const menu = document.getElementById('navMenu');
  const btn = document.querySelector('[data-action="toggle-menu"]');
  if (!menu || !btn) return;
  menu.hidden = !state.menuOpen;
  btn.setAttribute('aria-expanded', String(state.menuOpen));
  if (state.menuOpen) menu.querySelector('.menu__item')?.focus();
}

document.addEventListener('click', e => {
  // The skip link must not touch the hash router: focus the view instead.
  const skip = e.target.closest('.skip');
  if (skip) {
    e.preventDefault();
    const view = document.getElementById('main');
    view.focus();
    view.scrollIntoView();
    return;
  }

  // Any click outside the user area closes the account menu.
  if (state.menuOpen && !e.target.closest('.nav__user')) closeMenu();

  const tab = e.target.closest('[data-tab]');
  if (tab) { state.filters.mine = tab.dataset.tab === 'mine'; syncFilters(); return; }

  const chip = e.target.closest('[data-type]');
  if (chip) {
    state.filters.type = state.filters.type === chip.dataset.type ? null : chip.dataset.type;
    syncFilters();
    return;
  }

  const el = e.target.closest('[data-action]');
  if (!el) return;
  const id = el.dataset.id;

  switch (el.dataset.action) {
    case 'go-login':
      state.returnTo = (location.hash || '#/');
      break;
    case 'login':
      doLogin();
      break;
    case 'toggle-menu':
      toggleMenu();
      break;
    case 'logout':
      logout();
      break;
    case 'clear-search': {
      state.filters.q = '';
      const input = document.getElementById('search');
      if (input) { input.value = ''; input.focus(); }
      syncFilters();
      break;
    }
    case 'remove-photo': {
      const prev = document.getElementById('photoPrev');
      const input = document.getElementById('in-photo');
      if (prev) prev.hidden = true;
      if (input) input.value = '';
      break;
    }
    case 'mark-resolved': {
      const item = state.items.find(i => i.id === id);
      if (item) item.status = 'resolved';
      render();
      break;
    }
    case 'delete': {
      if (state.confirmDelete !== id) { state.confirmDelete = id; render(); break; }
      state.items = state.items.filter(i => i.id !== id);
      state.confirmDelete = null;
      location.hash = '#/';
      break;
    }
  }
});

document.addEventListener('keydown', e => { if (e.key === 'Escape') closeMenu(); });

document.addEventListener('input', e => {
  if (e.target.id === 'search') {
    state.filters.q = e.target.value;
    renderGrid();
    const clear = document.querySelector('[data-action="clear-search"]');
    if (clear) clear.hidden = !state.filters.q;
    return;
  }
  // Inline validation clears as soon as the field is fixed.
  if (e.target.id === 'in-name' && e.target.value.trim()) setError('name', '');
  if (e.target.id === 'in-location' && e.target.value.trim()) setError('location', '');
});

document.addEventListener('change', e => {
  if (e.target.id === 'in-photo') {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      document.getElementById('photoImg').src = ev.target.result;
      document.getElementById('photoPrev').hidden = false;
    };
    reader.readAsDataURL(file);
  }
  if (e.target.name === 'type') {
    const found = e.target.value === 'found';
    // The location field re-words itself with the type.
    const locLabel = document.querySelector('label[for="in-location"]');
    const locInput = document.getElementById('in-location');
    if (locLabel) locLabel.textContent = found ? 'Where did you find it?' : 'Where did you lose it?';
    if (locInput) locInput.placeholder = found
      ? 'e.g. Room 112, cafeteria…' : 'e.g. Room 204, main hallway…';
    // Revealing the Found-only field: quick rise so it doesn't just pop in.
    const field = document.getElementById('currentField');
    if (!field) return;
    field.hidden = !found;
    if (!field.hidden) {
      field.classList.remove('field--enter');
      void field.offsetWidth;
      field.classList.add('field--enter');
    }
  }
});

document.addEventListener('submit', e => {
  if (e.target.id === 'addForm') { e.preventDefault(); submitForm(e.target); }
});

window.addEventListener('hashchange', render);
render();
</script>
</body>
</html>
